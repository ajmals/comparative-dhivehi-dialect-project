name: Sync Data from Google Sheets

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sync script (Master Benchmark)
        run: python3 scripts/sync_from_sheets.py

      - name: Run sync script (Regional Atolls & Compilation)
        run: python3 scripts/sync_atolls.py --compile

      - name: Roll up Island Consensus into Master Dataset
        run: python3 scripts/rollup_consensus.py

      - name: Recalculate Edit Distances
        run: python3 scripts/calculate_edit_distance.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dhivehi_language_comparision.csv data/
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore: sync dataset from Google Sheets and update edit distances [skip ci]"
            git push
          fi
